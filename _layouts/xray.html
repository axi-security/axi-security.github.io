---
layout: default
---
<article class = "xray">
<div class="xray-content">
    <div class="wrapper-xray">
        <!-- Title and Logo Section -->
        <div class="title-logo">
             <!-- <img src="{{ '/assets/expect_logo.png' | relative_url }}" alt="eXpect Logo" class="logo" />-->
            <h1 class="xray-title">{{ page.title }}</h1> <!-- Title from Markdown -->
        </div>

        <!-- Two Column Layout (Authors and Content) -->
        <div class="two-column-layout">
            <!-- Authors Section -->
        	<div class="column authors">
		<!-- Authors and Markdown Content -->
		<h2>Authors</h2>
                	<ul>
                    		<li><a href="https://melisandezonta.com" target="_blank">Melisande Zonta-Roudes</a></li>
                    		<li>Nora Hinderling</li>
                    		<li><a href="https://n.ethz.ch/~sshivaji" target="_blank">Shweta Shinde</a></li>
                	</ul>
		
		<div class="links">
		<div class="rectangle-container">
			<a href="https://github.com/axi-security/xray">
				<span class="rectangle github-rect">
					{% include icon-github.svg %}
				</span>
			</a> 
			<a href="{{ '/assets/xray.pdf' | relative_url }}">
				<span class="rectangle pdf-rect">
					{% include icon-paper.svg %}	
				</span>
			</a>
                

		</div>
		</div>
		</div>

            <!-- Content Section -->
            <div class="column content">
                <!-- Abstract and Markdown Content -->
		{% if page.content_type == "abstract" %}
                {{ content }} <!-- Abstract and other Markdown content -->
		{% endif %}
                <!-- Rectangles Section -->
            </div>
        </div>
    </div>
</div>
</article>
